<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>红盒子供销平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --top:#1b2735; --top-hover:#26354a; --top-active:#2463eb;
  --bg:#f4f6fa; --card:#fff; --line:#e6ebf3; --line-soft:#eef2f8;
  --text:#1c2740; --muted:#7b8798; --blue:#2463eb; --green:#18a05e;
  --top-h:56px; --tab-h:40px; --side-w:232px;
}
html,body{height:100%}
body{font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden}

/* ---------- 顶部一级菜单 ---------- */
.topbar{height:var(--top-h);background:var(--top);display:flex;align-items:center;gap:4px;padding:0 14px 0 16px;flex-shrink:0;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-size:15.5px;font-weight:700;letter-spacing:.2px;padding-right:14px;white-space:nowrap}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(36,99,235,.45)}
/* 品牌维度切换：选中的品牌会成为全局上下文，所有标签页都按它过滤 */
.brandpick{display:flex;align-items:center;gap:7px;height:34px;padding:0 9px 0 6px;margin-right:10px;border-radius:9px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);flex-shrink:0;transition:background .15s,border-color .15s}
.brandpick:hover{background:rgba(255,255,255,.16)}
.brandpick.on{background:rgba(36,99,235,.6);border-color:rgba(96,140,250,.9)}
.bp-logo{width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;line-height:1;flex-shrink:0;background:transparent;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.brandpick select{background:transparent;border:0;color:#fff;font-size:13.5px;font-family:inherit;font-weight:700;max-width:150px;outline:none;cursor:pointer;padding:0;appearance:none;-webkit-appearance:none}
.brandpick select option{color:#1c2740;background:#fff;font-weight:500}
.brandpick .bp-arrow{font-size:10px;color:#a9b7ca;line-height:1;pointer-events:none}
.primary{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.primary::-webkit-scrollbar{display:none}
.pitem{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:9px;color:#c2cddd;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;border:0;background:transparent;font-family:inherit;transition:background .15s,color .15s}
.pitem:hover{background:var(--top-hover);color:#fff}
.pitem.active{background:var(--top-active);color:#fff;font-weight:600;box-shadow:0 2px 10px rgba(36,99,235,.35)}
.pitem .ic{font-size:15px;line-height:1}
.topright{display:flex;align-items:center;gap:10px;padding-left:14px;flex-shrink:0}
.ver{font-size:12px;color:#8b98ab;white-space:nowrap}
.ver b{color:#c9d4e2;font-weight:600}

/* ---------- 主体 ---------- */
.body{display:flex;height:calc(100% - var(--top-h));min-height:0}

/* 左侧二级菜单 */
.side{width:var(--side-w);background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;transition:width .18s ease;overflow:hidden}
.side.hidden{width:0;border-right:0}
.sideInner{width:var(--side-w);display:flex;flex-direction:column;height:100%}
.sideTitle{padding:16px 18px 10px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
.secondary{flex:1;overflow-y:auto;padding:2px 10px 12px}
.sitem{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:2px 0;border-radius:9px;color:#4a5568;font-size:13.5px;text-decoration:none;cursor:pointer;white-space:nowrap;border:0;background:transparent;font-family:inherit;width:100%;text-align:left;transition:background .13s,color .13s}
.sitem .ic{width:17px;text-align:center;font-size:14.5px;flex-shrink:0}
.sitem:hover{background:#f2f5fb;color:var(--text)}
.sitem.active{background:#eaf0fe;color:var(--blue);font-weight:650}
.sitem .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .badge{flex-shrink:0;margin-left:auto;font-size:10px;line-height:1;color:#98a2b3;background:#f2f4f7;border-radius:5px;padding:3px 5px}
.sitem .badge.planned{color:#b54708;background:#fffaeb}
.sitem.active::after{content:"";margin-left:auto;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.sideEmpty{padding:14px 12px;font-size:12.5px;color:var(--muted);line-height:1.7}

/* 右侧主区 */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

/* 标签页 */
.tabbar{height:var(--tab-h);background:#eef2f8;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px 0 6px;flex-shrink:0;gap:6px}
.menutoggle{width:28px;height:28px;border:0;background:transparent;color:#5b6778;font-size:15px;cursor:pointer;border-radius:7px;flex-shrink:0}
.menutoggle:hover{background:#e2e8f3;color:var(--text)}
.tabstrip{display:flex;align-items:center;gap:5px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding:3px 0}
.tabstrip::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:30px;padding:0 8px 0 12px;border-radius:8px;font-size:13px;color:#5b6778;cursor:pointer;white-space:nowrap;background:transparent;border:1px solid transparent;flex-shrink:0;transition:background .13s}
.tab:hover{background:#e3e9f4}
.tab.active{background:#fff;border-color:var(--line);color:var(--text);font-weight:650;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.tab .x{width:16px;height:16px;border:0;background:transparent;color:#9aa6b6;font-size:14px;line-height:1;cursor:pointer;border-radius:4px;padding:0;display:flex;align-items:center;justify-content:center}
.tab .x:hover{background:#e6ebf3;color:#c0392b}
.tabtools{display:flex;align-items:center;gap:4px;flex-shrink:0;padding-left:4px}
.iconbtn{width:28px;height:28px;border:0;background:transparent;color:#5b6778;font-size:14px;cursor:pointer;border-radius:7px}
.iconbtn:hover{background:#e3e9f4;color:var(--text)}

/* 标签内容 */
.frames{position:relative;flex:1;min-height:0;background:var(--bg)}
.frame{position:absolute;inset:0;display:none}
.frame.active{display:block}
.frame iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
.blank{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13.5px}
.blank .big{font-size:34px;opacity:.35}
.blank.hide{display:none}

@media(max-width:1250px){
  .brandname{display:none}
  .ver{display:none}
}
@media(max-width:900px){
  .side{position:absolute;top:var(--top-h);bottom:0;left:0;z-index:15;box-shadow:6px 0 20px rgba(16,24,40,.12)}
  .brand{padding-right:10px}
  .brandname{display:none}
  .pitem{padding:0 6px;font-size:12.5px;gap:4px}
  .pitem .ic{display:none}
}
@media(max-width:800px){
  .pitem{padding:0 4px;font-size:12px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">🤝</span><span class="brandname">红盒子供销平台</span></div>
  <div class="brandpick" id="brandPick" title="选择品牌后，所有页面只处理这个品牌的数据">
    <span class="bp-logo" id="bpLogo">🏷</span>
    <select id="brandSelect" onchange="switchBrand(this.value)" aria-label="品牌">
      <option value="">全部品牌</option>
    </select>
    <span class="bp-arrow">▾</span>
  </div>
  <nav class="primary" id="primaryNav"></nav>
  <div class="topright">
    <span class="ver">v<b id="verText">--</b></span>
    <button class="iconbtn" id="btnReloadTop" title="刷新当前标签页" style="color:#c2cddd">↻</button>
  </div>
</header>

<div class="body">
  <aside class="side" id="side">
    <div class="sideInner">
      <div class="sideTitle" id="sideTitle">菜单</div>
      <nav class="secondary" id="secondaryNav"></nav>
    </div>
  </aside>

  <main class="main">
    <div class="tabbar">
      <button class="menutoggle" id="btnMenu" title="展开 / 收起左侧菜单">☰</button>
      <div class="tabstrip" id="tabStrip"></div>
      <div class="tabtools">
        <button class="iconbtn" id="btnReload" title="刷新当前页">↻</button>
        <button class="iconbtn" id="btnCloseAll" title="关闭全部标签">✕</button>
      </div>
    </div>
    <div class="frames" id="frames">
      <div class="blank" id="blank">
        <div class="big">🗂</div>
        <div>还没有打开任何页面</div>
        <div style="font-size:12.5px">从顶部菜单选择，或在左侧二级菜单里点开</div>
      </div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   菜单配置：顶部一级菜单 → 左侧二级菜单
   每点开一个二级菜单，就在标签栏新增一个 TAB（同一个只会开一次，不会重复） */
/* 未实现功能统一进占位页：说明「待开发」，不建假页面、不放假数据 */
const ph = (label, top, phase) => '/coming-soon?embed=1&label=' + encodeURIComponent(label)
  + '&top=' + encodeURIComponent(top) + '&phase=' + encodeURIComponent(phase || '');

const MENUS = [
  { key: 'workbench', label: '工作台', icon: '🏠', children: [
    { key: 'wb-overview', label: '经营总览', icon: '📊', url: '/workbench?embed=1' },
    { key: 'wb-todo', label: '待办任务', icon: '✅', url: ph('待办任务', '工作台', 'P6'), planned: true, phase: 'P6' },
    { key: 'wb-alerts', label: '异常预警', icon: '⚠️', url: ph('异常预警', '工作台', 'P6'), planned: true, phase: 'P6' },
    { key: 'wb-recent', label: '最近访问', icon: '🕘', url: ph('最近访问', '工作台', 'P1'), planned: true, phase: 'P1' },
  ]},
  { key: 'dist', label: '分销管理', icon: '🤝', children: [
    { key: 'dist-archive', label: '分销商档案', icon: '🏢', url: '/distribution?embed=1&tab=distributors' },
    { key: 'dist-apply', label: '分销商申请审核', icon: '📝', url: ph('分销商申请审核', '分销管理', 'P3'), planned: true, phase: 'P3' },
    { key: 'dist-price', label: '分销价格', icon: '💰', url: '/distribution?embed=1&tab=prices' },
    { key: 'dist-rebate', label: '返利政策', icon: '％', url: ph('返利政策', '分销管理', 'P4'), planned: true, phase: 'P4' },
    { key: 'dist-statement', label: '对账管理', icon: '📑', url: '/distribution?embed=1&tab=statements' },
  ]},
  { key: 'product', label: '商品管理', icon: '📦', children: [
    { key: 'prod-archive', label: '商品档案', icon: '📦', url: '/distribution?embed=1&tab=products' },
    { key: 'prod-category', label: '商品分类', icon: '🏷', url: ph('商品分类', '商品管理', 'P6'), planned: true, phase: 'P6' },
    { key: 'prod-sku', label: 'SKU 管理', icon: '🔖', url: '/distribution?embed=1&tab=products', badge: '页内' },
    { key: 'prod-shelf', label: '商品上下架', icon: '🔀', url: '/distribution?embed=1&tab=products', badge: '页内' },
    { key: 'prod-catalog', label: '分销商品目录', icon: '📚', url: ph('分销商品目录', '商品管理', 'P6'), planned: true, phase: 'P6' },
    { key: 'prod-stock', label: '商品库存与可供货状态', icon: '📊', url: ph('商品库存与可供货状态', '商品管理', 'P6'), planned: true, phase: 'P6' },
  ]},
  { key: 'order', label: '分销订单', icon: '🧾', children: [
    { key: 'order-entry', label: '分销下单', icon: '🛒', url: '/distribution?embed=1&tab=entry' },
    { key: 'order-all', label: '分销订单', icon: '🧾', url: '/distribution?embed=1&tab=orders' },
    { key: 'order-status', label: '订单状态处理', icon: '🔧', url: '/distribution?embed=1&tab=ostatus' },
    { key: 'order-search', label: '订单查询', icon: '🔎', url: '/distribution?embed=1&tab=orders', badge: '页内' },
  ]},
  { key: 'purchase', label: '采购与到货', icon: '🚛', children: [
    { key: 'purchase-orders', label: '采购单订单情况', icon: '🧾', url: '/purchase?embed=1' },
  ]},
  { key: 'finance', label: '财务对账', icon: '💳', children: [
    { key: 'fin-reconcile', label: '分销商对账', icon: '📑', url: '/distribution?embed=1&tab=statements' },
    { key: 'fin-ar', label: '应收账款', icon: '💳', url: ph('应收账款', '财务对账', 'P4'), planned: true, phase: 'P4' },
    { key: 'fin-rebate', label: '返利核算', icon: '％', url: ph('返利核算', '财务对账', 'P4'), planned: true, phase: 'P4' },
    { key: 'fin-receipts', label: '收付款记录', icon: '💵', url: ph('收付款记录', '财务对账', 'P4'), planned: true, phase: 'P4' },
    { key: 'fin-statement', label: '对账单管理', icon: '🗂', url: '/distribution?embed=1&tab=statements', badge: '部分' },
  ]},
  { key: 'report', label: '报表中心', icon: '📈', children: [
    { key: 'report-dist-sales', label: '分销销售报表', icon: '📈', url: ph('分销销售报表', '报表中心', 'P6'), planned: true, phase: 'P6' },
    { key: 'report-product-sales', label: '商品销售报表', icon: '📦', url: ph('商品销售报表', '报表中心', 'P6'), planned: true, phase: 'P6' },
    { key: 'report-dist-ops', label: '分销商经营报表', icon: '🏢', url: ph('分销商经营报表', '报表中心', 'P6'), planned: true, phase: 'P6' },
    { key: 'report-stock-ship', label: '库存与发货报表', icon: '🚚', url: ph('库存与发货报表', '报表中心', 'P6'), planned: true, phase: 'P6' },
    { key: 'report-finance', label: '财务统计报表', icon: '💳', url: ph('财务统计报表', '报表中心', 'P6'), planned: true, phase: 'P6' },
  ]},
  { key: 'system', label: '系统设置', icon: '⚙️', children: [
    { key: 'sys-users', label: '用户与角色', icon: '👥', url: ph('用户与角色', '系统设置', 'P5'), planned: true, phase: 'P5' },
    { key: 'sys-perms', label: '权限管理', icon: '🔐', url: ph('权限管理', '系统设置', 'P5'), planned: true, phase: 'P5' },
    { key: 'sys-approval', label: '审核流程', icon: '🧭', url: ph('审核流程', '系统设置', 'P5'), planned: true, phase: 'P5' },
    { key: 'sys-params', label: '系统参数', icon: '⚙️', url: ph('系统参数', '系统设置', 'P6'), planned: true, phase: 'P6' },
    { key: 'sys-logs', label: '操作日志', icon: '📜', url: ph('操作日志', '系统设置', 'P5'), planned: true, phase: 'P5' },
    { key: 'sys-integration', label: '数据接口配置', icon: '🔌', url: ph('数据接口配置', '系统设置', 'P6'), planned: true, phase: 'P6' },
    { key: 'sys-update', label: '系统更新', icon: '🔄', url: '/system-update?embed=1' },
  ]},
];

const STORE_KEY = 'fx_shell_state_v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let state = { menu: 'workbench', sideOpen: true, tabs: [], active: '', brand: '' };

/* ---------- 品牌维度：全局上下文 ----------
   选中的品牌存在 sessionStorage，所有 iframe 打开时自动带上 ?brand=，
   子页面（distribution / workbench / reports 等）自己按这个参数过滤。
   tab.url 里始终存"干净地址"，品牌只在挂载 iframe 时拼上去，
   这样切换品牌不会把标签去重逻辑搞乱。 */
let brandList = [];

function shortBrand(b) {
  const s = String(b == null ? '' : b);
  const i = s.indexOf('/');
  return i > 0 ? s.slice(0, i) : s;
}

function withBrand(url, brand) {
  if (!url) return url;
  try {
    const u = new URL(url, location.origin);
    if (brand) u.searchParams.set('brand', brand);
    else u.searchParams.delete('brand');
    return u.pathname + (u.search || '') + (u.hash || '');
  } catch (e) { return url; }
}

async function loadBrands() {
  try {
    const res = await fetch('/api/fx/brands');
    const data = await res.json();
    brandList = Array.isArray(data.brands) ? data.brands : [];
  } catch (e) { brandList = []; }
  renderBrandSelect();
}

/* 品牌彩色徽标：每个品牌一个主色 + 首字，让顶栏一眼认出当前品牌 */
const BRAND_COLORS = {
  '格力高': '#e60012', '雀巢': '#3f6fa8', '桂格': '#b5442d', '瑞士莲': '#c8102e',
  '乐事': '#e0a400', '三养': '#d94f2b', '海兴': '#0e9488', '奇多': '#f26f21',
  '乐多飞': '#7c5cbf', '爱思得': '#2b7de9', '特百惠': '#e0468c', '伯纳天纯': '#3f9142',
};
function brandMark(brand) {
  const s = shortBrand(brand);
  return { ch: (s || '?')[0], c: BRAND_COLORS[s] || '#5b6b84' };
}

function renderBrandSelect() {
  const sel = $('brandSelect');
  if (!sel) return;
  const cur = state.brand || '';
  sel.innerHTML = '<option value="">全部品牌</option>' + brandList.map(b => {
    const name = esc(shortBrand(b.brand));
    const sel0 = b.brand === cur ? ' selected' : '';
    return `<option value="${esc(b.brand)}"${sel0}>${name}（${b.count}）</option>`;
  }).join('');
  // 顶栏品牌 LOGO 徽标：选中品牌显示品牌色+首字，全部品牌显示 🏷
  const lg = $('bpLogo');
  if (lg) {
    if (cur) { const m = brandMark(cur); lg.textContent = m.ch; lg.style.background = m.c; }
    else { lg.textContent = '🏷'; lg.style.background = 'transparent'; lg.style.boxShadow = 'none'; }
  }
  // 选中的品牌如果已不在列表里（商品改名/停用），回落到「全部品牌」
  if (cur && !brandList.some(b => b.brand === cur)) {
    state.brand = '';
    sel.value = '';
    save();
  }
  const pick = $('brandPick');
  if (pick) pick.classList.toggle('on', !!state.brand);
}

function switchBrand(value) {
  state.brand = value || '';
  save();
  renderBrandSelect();
  // 已打开的标签全部换到新品牌上下文
  state.tabs.forEach(t => {
    const box = $('f_' + t.key);
    const f = box && box.querySelector('iframe');
    if (f) f.src = withBrand(t.url, state.brand);
  });
}

/* ---------- 存取记忆：刷新页面后标签还在，不迷路 ---------- */
function save() {
  try {
    sessionStorage.setItem(STORE_KEY, JSON.stringify({
      menu: state.menu, sideOpen: state.sideOpen,
      tabs: state.tabs.map(t => ({ key: t.key, label: t.label, url: t.url, menuKey: t.menuKey || '' })),
      active: state.active,
      brand: state.brand || '',
    }));
  } catch (e) { /* 隐私模式下忽略 */ }
}
function restore() {
  try {
    const raw = sessionStorage.getItem(STORE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && typeof saved === 'object') {
      if (MENUS.some(m => m.key === saved.menu)) state.menu = saved.menu;
      state.sideOpen = saved.sideOpen !== false;
      state.tabs = Array.isArray(saved.tabs)
        ? saved.tabs.filter(t => t && t.url).map(t => ({
            key: t.key || ('t' + Math.random().toString(36).slice(2, 8)),
            label: t.label || '',
            url: t.url,
            menuKey: t.menuKey || (findChild('', t.url) && findChild('', t.url).child.key) || '',
          }))
        : [];
      state.active = saved.active || '';
      state.brand = typeof saved.brand === 'string' ? saved.brand : '';
    }
  } catch (e) { /* 忽略坏数据 */ }
}

/* ---------- 菜单查找 ---------- */
function findMenu(key) { return MENUS.find(m => m.key === key) || MENUS[0]; }
function findChild(key, url) {
  for (const m of MENUS) {
    for (const c of m.children) {
      if (key && c.key === key) return { menu: m, child: c };
      if (!key && url && normUrl(c.url) === normUrl(url)) return { menu: m, child: c };
    }
  }
  return null;
}
function normUrl(u) { return String(u || ''); }

/* ---------- 渲染 ---------- */
function renderPrimary() {
  $('primaryNav').innerHTML = MENUS.map(m =>
    `<button class="pitem ${m.key === state.menu ? 'active' : ''}" data-menu="${m.key}" onclick="pickMenu('${m.key}')">
       <span class="ic">${m.icon}</span>${esc(m.label)}
     </button>`).join('');
}

function renderSecondary() {
  const menu = findMenu(state.menu);
  $('sideTitle').textContent = menu.label;
  const activeTab = state.tabs.find(t => t.key === state.active);
  $('secondaryNav').innerHTML = menu.children.length
    ? menu.children.map(c => {
        const open = state.tabs.some(t => normUrl(t.url) === normUrl(c.url));
        const active = !!activeTab && (activeTab.menuKey ? activeTab.menuKey === c.key : normUrl(activeTab.url) === normUrl(c.url));
        const badge = c.planned
          ? `<span class="badge planned" title="计划 ${esc(c.phase || '')}">待开发</span>`
          : (c.badge ? `<span class="badge">${esc(c.badge)}</span>` : '');
        return `<button class="sitem ${active ? 'active' : ''} ${open ? 'is-open' : ''}" title="${esc(c.label)}${c.planned ? '（待开发）' : ''}" onclick="openChild('${c.key}')">
                  <span class="ic">${c.icon || '·'}</span><span class="txt">${esc(c.label)}</span>${badge}
                </button>`;
      }).join('')
    : `<div class="sideEmpty">这个菜单下暂时没有页面</div>`;
}

function renderTabs() {
  const strip = $('tabStrip');
  strip.innerHTML = state.tabs.map(t =>
    `<div class="tab ${t.key === state.active ? 'active' : ''}" onclick="activate('${t.key}')" title="${esc(t.label)}">
       <span>${esc(t.label)}</span>
       <button class="x" title="关闭" onclick="event.stopPropagation();closeTab('${t.key}')">×</button>
     </div>`).join('');
  const blank = $('blank');
  if (blank) blank.classList.toggle('hide', state.tabs.length > 0);
}

/* ---------- 打开 / 切换 / 关闭 ---------- */
function pickMenu(key) {
  const menu = findMenu(key);
  // 再点一次当前一级菜单 = 收起/展开左侧
  if (state.menu === key && state.sideOpen) {
    state.sideOpen = false;
    applySide();
    state.menu = key;
    renderPrimary();
    save();
    return;
  }
  state.menu = key;
  state.sideOpen = true;
  renderPrimary(); renderSecondary(); applySide();
  // 只有一个子菜单时直接打开，省一次点击
  if (menu.children.length === 1) openChild(menu.children[0].key);
  save();
}

function openChild(key) {
  const hit = findChild(key, null);
  if (!hit) return;
  openUrl(hit.child.url, hit.child.label, key);
}

/** 供子页面调用：favicon 一样的小跳转，统一走标签，不整页跳走 */
window.__fxOpen = function (url, label) { openUrl(url, label, ''); };

function openUrl(url, label, key) {
  if (!url) return;
  // 已经开过同一个地址 → 只切换，不重开（这是"避免页面反复跳"的核心）
  let tab = state.tabs.find(t => normUrl(t.url) === normUrl(url));
  if (tab) {
    // 同一页面可能有多个菜单别名（如商品档案 / SKU 管理），记住最后点的那个用于左栏高亮
    if (key) tab.menuKey = key;
    if (label) tab.label = label;
    activate(tab.key);
    return;
  }

  const child = findChild(key || '', url);
  const id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  tab = {
    key: id,
    label: label || (child && child.child.label) || guessLabel(url),
    url,
    menuKey: key || (child && child.child.key) || '',
  };
  state.tabs.push(tab);
  mountFrame(tab);
  activate(tab.key);
}

function guessLabel(url) {
  const path = normUrl(url).split('?')[0].replace(/\/$/, '') || '/';
  if (path === '/coming-soon') {
    const q = new URLSearchParams(String(url).split('?')[1] || '');
    return q.get('label') || '功能规划中';
  }
  const map = { '/': '首页', '/workbench': '经营总览', '/distribution': '分销管理',
                '/shipments': '发货记录', '/reports': '报表中心', '/sales-outbound': '销售出库单',
                '/system-update': '系统更新' };
  return map[path] || path;
}

function mountFrame(tab) {
  const box = document.createElement('div');
  box.className = 'frame';
  box.id = 'f_' + tab.key;
  const f = document.createElement('iframe');
  f.src = withBrand(tab.url, state.brand);
  f.setAttribute('loading', 'eager');
  f.title = tab.label;
  box.appendChild(f);
  $('frames').appendChild(box);
}

function activate(key) {
  const tab = state.tabs.find(t => t.key === key);
  if (!tab) return;
  state.active = key;
  document.querySelectorAll('.frame').forEach(el => el.classList.toggle('active', el.id === 'f_' + key));
  renderTabs(); renderSecondary();
  // 左菜单跟着高亮到对应一级/二级（有 menuKey 时以它为准，处理同 URL 的多个别名）
  const hit = tab.menuKey ? findChild(tab.menuKey, null) : findChild('', tab.url);
  if (hit && hit.menu.key !== state.menu) { state.menu = hit.menu.key; renderPrimary(); renderSecondary(); }
  save();
}

function closeTab(key) {
  const idx = state.tabs.findIndex(t => t.key === key);
  if (idx < 0) return;
  const el = $('f_' + key);
  if (el) el.remove();
  state.tabs.splice(idx, 1);
  if (state.active === key) {
    const next = state.tabs[idx] || state.tabs[idx - 1];
    state.active = next ? next.key : '';
    if (next) {
      document.querySelectorAll('.frame').forEach(x => x.classList.toggle('active', x.id === 'f_' + next.key));
    }
  }
  renderTabs(); renderSecondary(); save();
}

function closeAll() {
  if (!state.tabs.length) return;
  state.tabs.forEach(t => { const el = $('f_' + t.key); if (el) el.remove(); });
  state.tabs = []; state.active = '';
  renderTabs(); renderSecondary(); save();
}

function reloadActive() {
  const tab = state.tabs.find(t => t.key === state.active);
  if (!tab) return;
  const el = $('f_' + tab.key);
  const f = el && el.querySelector('iframe');
  if (f) f.src = withBrand(tab.url, state.brand);
}

/* ---------- 左侧展开/收起 ---------- */
function applySide() {
  $('side').classList.toggle('hidden', !state.sideOpen);
}

/* ---------- 启动 ---------- */
restore();

/* 支持直接链接：/?menu=dist&open=fx-products
   —— 方便收藏某个页面，也让外部系统能一键跳到指定标签 */
const qs = new URLSearchParams(location.search);
const wantMenu = qs.get('menu');
const wantOpen = qs.get('open');
if (wantMenu && MENUS.some(m => m.key === wantMenu)) {
  state.menu = wantMenu;
  state.sideOpen = true;
}

renderPrimary();
renderSecondary();
applySide();

// 恢复上次的标签（重建 iframe，地址不变）
state.tabs.forEach(t => mountFrame(t));
if (state.active && state.tabs.some(t => t.key === state.active)) {
  activate(state.active);
} else if (state.tabs.length) {
  activate(state.tabs[state.tabs.length - 1].key);
} else {
  // 首次进来：默认打开经营总览
  openChild(MENUS[0].children[0].key);
}

// 深链接指定的页面优先
if (wantOpen) openChild(wantOpen);

$('btnMenu').onclick = () => { state.sideOpen = !state.sideOpen; applySide(); save(); };
$('btnReload').onclick = reloadActive;
$('btnReloadTop').onclick = reloadActive;
$('btnCloseAll').onclick = closeAll;

window.addEventListener('beforeunload', save);

// 品牌维度：拉取品牌清单填充顶栏切换器（失败不影响其他功能）
loadBrands();

// 版本号
fetch('/api/system-update/status', { cache: 'no-store' })
  .then(r => r.json())
  .then(d => { $('verText').textContent = d.current_version || '--'; })
  .catch(() => { $('verText').textContent = '--'; });
</script>
</body>
</html>
