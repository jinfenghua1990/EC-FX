<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>经营总览 · 红盒子供销平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sidebar:#1b2735; --sidebar-hover:#24334a; --active:#2463eb;
  --bg:#f4f6fa; --card:#fff; --line:#e8ecf3; --muted:#7b8798;
  --text:#1c2740; --blue:#2463eb; --green:#18a05e; --orange:#f59e0b; --red:#e5484d; --teal:#0e9f9a;
}
body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
/* ---------- 侧栏 ---------- */
.sidebar{width:216px;background:var(--sidebar);color:#c6d0de;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;font-size:16px;font-weight:700;color:#fff}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px}
.nav{flex:1;padding:6px 10px}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;margin:2px 0;border-radius:9px;color:#aab6c8;text-decoration:none;font-size:14px;position:relative}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav a:hover{background:var(--sidebar-hover);color:#fff}
.nav a.active{background:var(--active);color:#fff;font-weight:600}
/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:52px;flex-shrink:0}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs b{color:var(--text);font-weight:600}
.topright{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
.btn{border:1px solid #d6dce6;background:#fff;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--text);font-weight:500;text-decoration:none;display:inline-block}
.btn:hover{border-color:#b9c4d4}
.content{padding:20px 24px 40px;overflow:auto}
h1.page{font-size:22px;margin-bottom:16px}
/* ---------- 统计卡片 ---------- */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.stat .ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.stat .k{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.stat .v{font-size:20px;font-weight:750;letter-spacing:-.3px}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.ico.blue{background:#e8effd;color:var(--blue)}
.ico.green{background:#e5f6ee;color:var(--green)}
.ico.amber{background:#fdf3df;color:#d97706}
.ico.teal{background:#e0f4f3;color:var(--teal)}
.ico.red{background:#fdeaea;color:var(--red)}
.v.red{color:var(--red)}
/* ---------- 两栏 ---------- */
.mid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card h3{font-size:14.5px;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--blue)}
.bar{flex:1;height:10px;background:#eef1f6;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f7f9fc;text-align:left;padding:9px 10px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;color:#5b6778}
td{padding:10px;border-bottom:1px solid #f0f3f8;white-space:nowrap}
tr:hover td{background:#fafbfe}
td.num{font-variant-numeric:tabular-nums}
</style>
<link rel="stylesheet" href="/static/ui-type.css?v=20261028">
<script src="/static/embed.js"></script>
</head>
<body>

<aside class="sidebar">
  <div class="brand"><span class="logo">🛒</span>红盒子供销平台</div>
  <nav class="nav">
    <a class="active" href="/"><span class="ic">🏠</span>经营总览</a>
    <a href="/distribution"><span class="ic">🤝</span>分销管理</a>
    <a href="/shipments"><span class="ic">🚚</span>发货明细</a>
    <a href="/reports"><span class="ic">📊</span>报表中心</a>
    <a href="/system-update"><span class="ic">🔄</span>系统更新</a>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <div class="crumbs">工作台&nbsp;/&nbsp;<b>经营总览</b></div>
    <div class="topright">
      <span><span class="dot" id="wdtDot"></span><span id="wdtState">旺店通检测中…</span></span>
      <a class="btn" href="/system-update">系统更新</a>
    </div>
  </div>

  <div class="content">
    <h1 class="page">经营总览</h1>

    <div class="card">
      <div class="head"><h3>销售总览 · 旺店通出库</h3><span style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)">核算月份 <select id="soMonth" style="min-height:30px;border:1px solid #d8dee9;border-radius:8px;padding:4px 8px;font-size:13px;background:#fff"></select></span></div>
      <div class="stats" id="soStats" style="margin-bottom:0"></div>
    </div>

    <div class="card">
      <div class="head"><h3>近 6 个月趋势</h3><span style="font-size:12px;color:var(--muted)"><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#2463eb;margin-right:3px"></i>销售 <i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#f59e0b;margin-right:3px;margin-left:10px"></i>成本 <i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#18a05e;margin-right:3px;margin-left:10px"></i>毛利<span style="color:var(--red)">(红=负)</span></span></div>
      <div id="soTrend"></div>
    </div>

    <div class="mid" style="margin-bottom:0">
      <div class="card" style="margin-bottom:0">
        <div class="head"><h3>店铺分布</h3><span style="font-size:12.5px;color:var(--muted)" id="soShopInfo"></span></div>
        <table>
          <thead><tr><th>店铺</th><th>订单</th><th>销售金额</th><th>占比</th><th>毛利</th><th>毛利率</th></tr></thead>
          <tbody id="soShopRows"></tbody>
        </table>
        <div id="soShopEmpty" style="display:none;color:var(--muted);font-size:13px;text-align:center;padding:16px 0">本月暂无数据</div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="head"><h3>平台分布</h3><span style="font-size:12.5px;color:var(--muted)" id="soPlatInfo"></span></div>
        <table>
          <thead><tr><th>平台</th><th>订单</th><th>销售金额</th><th>占比</th><th>毛利</th><th>毛利率</th></tr></thead>
          <tbody id="soPlatRows"></tbody>
        </table>
        <div id="soPlatEmpty" style="display:none;color:var(--muted);font-size:13px;text-align:center;padding:16px 0">本月暂无数据</div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:0});
const fmt2=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});

async function checkWdt(){
  try{const r=await fetch('/api/wdt/test');if(r.ok){$('wdtState').textContent='旺店通已连接';return}}catch(e){}
  $('wdtDot').style.background='#f59e0b';$('wdtState').textContent='旺店通未连接';
}

/* ---------- 销售总览（旺店通出库，真实数据） ---------- */
const PLATFORM_NAMES={'39':'拼多多','75':'快手','69':'抖音','101':'得物'};
const pname=id=>PLATFORM_NAMES[String(id)]||String(id??'-');
async function jfetch(url){let r=await fetch(url);let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'请求失败');return d}
function esc2(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function defMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function prevMonths(n){const out=[];const now=new Date();for(let i=0;i<n;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`)}return out}

function soRenderStats(o){
  const t=o.effective_totals||{};
  const neg=v=>Number(v)<0?'red':'';
  const cards=[
    {k:'发货订单数',v:String(o.orders??0),sub:`已调整 ${o.adjusted_orders||0} · 已排除 ${o.excluded_orders||0}`,ico:'📦',cls:'blue'},
    {k:'销售金额',v:fmt(t.goods_total_amount),sub:'应收 '+fmt(t.receivable),ico:'💰',cls:'green'},
    {k:'货品成本',v:fmt(t.goods_total_cost),sub:'物流 '+fmt(t.post_cost)+' · 包装 '+fmt(t.package_cost),ico:'🏷️',cls:'amber'},
    {k:'毛利',v:fmt(o.effective_gross_profit),sub:'销售 - 成本 - 物流 - 包装',ico:'📈',cls:'teal',neg:neg(o.effective_gross_profit)},
    {k:'毛利率',v:(o.effective_gross_margin_pct??0)+'%',sub:'销售 - 成本 - 物流 - 包装',ico:'🎯',cls:'red',neg:neg(o.effective_gross_margin_pct)},
  ];
  $('soStats').innerHTML=cards.map(c=>`<div class="stat"><div class="ico ${c.cls}">${c.ico}</div><div><div class="k">${c.k}</div><div class="v ${c.neg||''}">${c.v}</div><div class="s">${c.sub}</div></div></div>`).join('');
}

async function soLoadTrend(){
  const months=prevMonths(6).reverse(); // 旧→新
  const data=await Promise.all(months.map(m=>jfetch(`/api/data/sales-outbound/overview?month=${m}`).catch(()=>null)));
  const rows=data.map((o,i)=>({m:months[i],sales:o?(o.effective_totals||{}).goods_total_amount||0:0,cost:o?(o.effective_totals||{}).goods_total_cost||0:0,gross:o?o.effective_gross_profit||0:0}));
  const W=1060,H=240,padL=64,padB=26,padT=14;
  const max=Math.max(1,...rows.map(r=>Math.max(r.sales,r.cost,Math.abs(r.gross))));
  const iw=(W-padL-20)/rows.length;
  const y=v=>padT+(H-padT-padB)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);
    s+=`<line x1="${padL}" y1="${yy}" x2="${W-10}" y2="${yy}" stroke="#eef1f6"/><text x="${padL-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#9aa5b5">${v>=10000?(v/10000).toFixed(1)+'万':Math.round(v)}</text>`}
  const bw=Math.min(16,iw/4);
  rows.forEach((r,i)=>{const cx=padL+iw*(i+.5);
    const bar=(v,dx,color)=>{const h=Math.max(0,(H-padT-padB)*v/max);const yy=y(v);
      return `<rect x="${cx+dx}" y="${yy}" width="${bw}" height="${h}" rx="3" fill="${color}"><title>${r.m}  ${color==='#2463eb'?'销售':color==='#f59e0b'?'成本':'毛利'} ${fmt(v)}</title></rect>`};
    s+=bar(r.sales,-bw*1.7,'#2463eb')+bar(r.cost,0,'#f59e0b');
    const gh=Math.max(0,(H-padT-padB)*Math.abs(r.gross)/max);
    if(r.gross>=0)s+=`<rect x="${cx+bw*1.7}" y="${y(r.gross)}" width="${bw}" height="${gh}" rx="3" fill="#18a05e"/>`;
    else s+=`<rect x="${cx+bw*1.7}" y="${y(0)}" width="${bw}" height="${gh}" rx="3" fill="#e5484d"/>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#7b8798">${r.m}</text>`;
  });
  s+='</svg>';
  $('soTrend').innerHTML=s;
}

function soDist(rowsEl,infoEl,emptyEl,list,totalSales,useName){
  if(!list||!list.length){$(rowsEl).innerHTML='';$(emptyEl).style.display='block';$(infoEl).textContent='';return}
  $(emptyEl).style.display='none';
  const maxSales=Math.max(...list.map(x=>Math.abs(x.sales)),1);
  $(rowsEl).innerHTML=list.map(x=>{
    const pct=totalSales?Math.abs(x.sales)/totalSales*100:0;
    const name=useName?pname(x.name):x.name;
    const w=Math.max(2,Math.abs(x.sales)/maxSales*100);
    return `<tr>
      <td style="max-width:230px;overflow:hidden;text-overflow:ellipsis" title="${esc2(name)}">${esc2(name)}</td>
      <td class="num">${x.orders}</td>
      <td class="num">${fmt2(x.sales)}</td>
      <td><div style="display:flex;align-items:center;gap:6px"><div class="bar" style="min-width:70px"><i style="width:${w}%;background:var(--blue)"></i></div><span style="font-size:11px;color:var(--muted)">${pct.toFixed(1)}%</span></div></td>
      <td class="num" style="color:${x.gross>=0?'var(--green)':'var(--red)'};font-weight:600">${fmt2(x.gross)}</td>
      <td class="num" style="color:${x.gross_margin_pct>=0?'var(--green)':'var(--red)'}">${x.gross_margin_pct}%</td>
    </tr>`}).join('');
}

async function soLoad(){
  const m=$('soMonth').value||defMonth();
  try{
    const o=await jfetch(`/api/data/sales-outbound/overview?month=${m}`);
    soRenderStats(o);
    const total=(o.effective_totals||{}).goods_total_amount||0;
    soDist('soShopRows','soShopInfo','soShopEmpty',o.shop_breakdown,total,false);
    soDist('soPlatRows','soPlatInfo','soPlatEmpty',o.platform_breakdown,total,true);
    $('soShopInfo').textContent=o.shop_breakdown?o.shop_breakdown.length+' 家店铺':'';
    $('soPlatInfo').textContent=o.platform_breakdown?o.platform_breakdown.length+' 个平台':'';
  }catch(e){
    $('soStats').innerHTML='<div style="grid-column:1/-1;color:var(--red);font-size:13px">销售总览加载失败：'+esc2(e.message)+'</div>';
  }
  soLoadTrend().catch(()=>{$('soTrend').textContent='趋势加载失败'});
}

function soInit(){
  $('soMonth').innerHTML=prevMonths(12).map((m,i)=>`<option value="${m}" ${i===0?'selected':''}>${m}</option>`).join('');
  $('soMonth').addEventListener('change',soLoad);
  soLoad();
}

checkWdt();
soInit();
</script>
</body>
</html>
